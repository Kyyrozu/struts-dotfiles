# Startup
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# startup apps
exec-once = /usr/bin/kwalletd6 &
exec-once = kwallet-query -l kdewallet
exec-once = waybar &
exec-once = swaync &
exec-once = hypridle &
exec-once = hyprpaper &
exec-once = hyprctl dispatch killwindow class:xwaylandvideobridge

# startup apps on different workspaces
workspace = 10, monitor:HDMI-A-1
workspace = 1, monitor:HDMI-A-1
workspace = 3, monitor:DP-3

windowrule {
	name = set-spotify-workspace
	match:class = spotify
	workspace = 10
}
windowrule {
	name = set-signal-workspace
	match:class = Signal
	workspace = 1
}
windowrule {
	name = set-discord-workspace
	match:class = discord
	workspace = 1
}

exec-once = [workspace 1 silent] flatpak run com.discordapp.Discord
exec-once = [workspace 1 silent] flatpak run org.signal.Signal
exec-once = [workspace 3] flatpak run app.zen_browser.zen
exec-once = /usr/bin/steam -silent %U

exec-once = focusmonitor DP-3

